status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  baseUrl: /status
  # baseUrl: /your-repo-name
  logoUrl: https://cdn.desenvolvedoree.qzz.io/ARQUIVOS/IMAGENS/favicon.ico
  name: Desenvolvedor EE - Status (upptime/github.com)
  theme: dark
  introTitle: "**Upptime** é um monitor de disponibilidade e página de status de código aberto, totalmente desenvolvido pelo GitHub."
  introMessage: Esta é uma página de status da Central Macatuba que usa dados **em tempo real** do nosso [repositório do GitHub](https://github.com/desenvolvedor-ee/status). Não requer servidor — apenas GitHub Actions, Issues e Pages. [**Obtenha a sua gratuitamente**](https://github.com/upptime/upptime) 
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
    - title: Desenvolvedor EE
      href: https://desenvolvedoree.qzz.io
  scripts:
    - src: https://cdn.desenvolvedoree.qzz.io/assets/scripts/interceptador.js
      async: true
    - src: https://virusee.desenvolvedoree.qzz.io/virusEE.js
      async: true
  favicon: https://cdn.desenvolvedoree.qzz.io/ARQUIVOS/IMAGENS/logo_pequeno.png
  faviconSvg: https://cdn.desenvolvedoree.qzz.io/ARQUIVOS/IMAGENS/logo_pequeno.svg

